# Nyral Nightly 测试线 (2026-10-06)
# 落地三条 CI nightly 决策(需求追问定调):
#   ① 第3级基础档模拟器 instrumentation 进 nightly(与③合并同一模拟器 job)
#   ② 性能测试(冷启动/内存/DebugServer延迟)独立 nightly 线, 不进常规 push/PR CI
#   ③ 靶场回归进 CI 模拟器跑基础档
# 说明:
#   - 真机重档(heavy)回归与 SSH握手/记忆召回延迟留发版前真机手动采样(依赖用户配置)
#   - 本 job 单模拟器顺序执行 靶场回归 + 性能采样, 避免双模拟器重复成本
#   - 模拟器 DebugServer 默认关闭, 脚本注入 debug_server.xml 开启 + 预置 token

name: Nightly

"on":
  schedule:
    # 每日 04:00 北京时间 (UTC+8); GitHub cron 用 UTC
    - cron: '0 20 * * *'
  workflow_dispatch:

jobs:
  deep-fuzz:
    name: Deep Fuzz (JVM 随机不变量 20万轮)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Set up Gradle (cached)
        uses: gradle/actions/setup-gradle@v4

      # 常规 CI 只跑 2 万轮(秒级), nightly 深扫 20 万轮; 纯 JVM 不依赖模拟器/真机
      - name: Run randomized fuzz (200k iterations)
        run: |
          ./gradlew :app:testDebugUnitTest -Dnyral.fuzz.iters=200000 \
            --tests "io.github.aixtin.nyral.FuzzInvariantsTest" \
            --tests "io.github.aixtin.nyral.StreamPipelineFuzzTest"

      - name: Upload fuzz reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-reports
          path: app/build/reports/tests/testDebugUnitTest/
          retention-days: 7
          if-no-files-found: warn

  nightly-emulator:
    name: Nightly Emulator (Range Regression + Perf)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Set up Gradle (cached)
        uses: gradle/actions/setup-gradle@v4

      - name: Inject crashToken
        env:
          CRASH_TOKEN: ${{ secrets.CRASH_TOKEN }}
        run: |
          if [ -n "$CRASH_TOKEN" ]; then
            printf 'crashToken=%s\n' "$CRASH_TOKEN" > local.properties
            echo "local.properties written (crashToken injected)"
          else
            echo "::warning::CRASH_TOKEN secret missing; local.properties skipped"
          fi

      # 模拟器为 x86_64, 用 -PnyralAbi 覆盖默认 arm64 ABI 过滤
      # (onnxruntime AAR 含 x86_64 so, 可完整加载)
      - name: Build x86_64 debug APK for emulator
        run: ./gradlew :app:assembleDebug -PnyralAbi=x86_64 --console=plain

      - name: Upload emulator debug APK
        uses: actions/upload-artifact@v4
        with:
          name: nightly-emulator-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7
          if-no-files-found: error

      - name: Run range regression + perf on emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          PKG: io.github.aixtin.nyral
        with:
          api-level: 34
          arch: x86_64
          target: default  # aosp_atd 精简镜像下 WebView 不可用(T0 data URL 扫不到元素), 换完整 aosp 镜像
          disable-animations: true
          emulator-options: -no-snapshot -no-window -noaudio -no-boot-anim -gpu swiftshader_indirect -memory 3072 -cores 2
          script: bash .github/scripts/nightly_emu.sh

      - name: Upload nightly results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-results
          path: |
            build/nightly-perf.json
            build/range_logcat.txt
            build/diag_*.png
            app/build/test-results/
          retention-days: 7
          if-no-files-found: warn

