# Nyral Nightly 测试线 (2026-10-06)
# 落地三条 CI nightly 决策(需求追问定调):
#   ① 第3级基础档模拟器 instrumentation 进 nightly(与③合并同一模拟器 job)
#   ② 性能测试(冷启动/内存/DebugServer延迟)独立 nightly 线, 不进常规 push/PR CI
#   ③ 靶场回归进 CI 模拟器跑基础档
# 说明:
#   - 真机重档(heavy)回归与 SSH握手/记忆召回延迟留发版前真机手动采样(依赖用户配置)
#   - 本 job 单模拟器顺序执行 靶场回归 + 性能采样, 避免双模拟器重复成本
#   - 模拟器 DebugServer 默认关闭, 脚本注入 debug_server.xml 开启 + 预置 token

name: Nightly

"on":
  schedule:
    # 每日 04:00 北京时间 (UTC+8); GitHub cron 用 UTC
    - cron: '0 20 * * *'
  workflow_dispatch:

jobs:
  nightly-emulator:
    name: Nightly Emulator (Range Regression + Perf)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Set up Gradle (cached)
        uses: gradle/actions/setup-gradle@v4

      - name: Inject crashToken
        env:
          CRASH_TOKEN: ${{ secrets.CRASH_TOKEN }}
        run: |
          if [ -n "$CRASH_TOKEN" ]; then
            printf 'crashToken=%s\n' "$CRASH_TOKEN" > local.properties
            echo "local.properties written (crashToken injected)"
          else
            echo "::warning::CRASH_TOKEN secret missing; local.properties skipped"
          fi

      # 模拟器为 x86_64, 用 -PnyralAbi 覆盖默认 arm64 ABI 过滤
      # (onnxruntime AAR 含 x86_64 so, 可完整加载)
      - name: Build x86_64 debug APK for emulator
        run: ./gradlew :app:assembleDebug -PnyralAbi=x86_64 --console=plain

      - name: Upload emulator debug APK
        uses: actions/upload-artifact@v4
        with:
          name: nightly-emulator-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7
          if-no-files-found: error

      - name: Run range regression + perf on emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          PKG: io.github.aixtin.nyral
        with:
          api-level: 34
          arch: x86_64
          target: aosp_atd
          disable-animations: true
          emulator-options: -no-snapshot -no-window -noaudio -no-boot-anim -gpu swiftshader_indirect -memory 3072 -cores 2
          script: |
            set -e
            echo "== 1. 安装 APK =="
            adb install -r app/build/outputs/apk/debug/app-debug.apk

            echo "== 2. 注入 DebugServer 开关与 token (CI 新装默认关闭) =="
            printf '%s' '<?xml version="1.0" encoding="utf-8" standalone="yes" ?><map><boolean name="enabled" value="true" /><string name="token">droid-nightly-'"$GITHUB_RUN_ID"'</string></map>' > /tmp/debug_server.xml
            adb push /tmp/debug_server.xml /data/local/tmp/debug_server.xml
            adb shell run-as $PKG mkdir -p shared_prefs
            adb shell "run-as $PKG cp /data/local/tmp/debug_server.xml shared_prefs/debug_server.xml"
            adb shell run-as $PKG cat shared_prefs/debug_server.xml

            echo "== 2.5 注入 guide_done=true (引导页直达主界面触发 DebugServer init) =="
            printf '%s' '<?xml version="1.0" encoding="utf-8" standalone="yes" ?><map><boolean name="guide_done" value="true" /></map>' > /tmp/app_prefs.xml
            adb push /tmp/app_prefs.xml /data/local/tmp/app_prefs.xml
            adb shell "run-as $PKG cp /data/local/tmp/app_prefs.xml shared_prefs/app_prefs.xml"
            adb shell run-as $PKG cat shared_prefs/app_prefs.xml

            echo "== 3. 启动 App (触发 DebugServer init) =="
            adb logcat -c
            adb shell am force-stop $PKG
            adb shell am start -W -n $PKG/.GuideActivity
            adb forward tcp:8765 tcp:8765
            # 就绪探测改为真实 HTTP 请求: 软模拟冷启动 DebugServer init 可达 60s+,
            # 纯 TCP connect 只能验证 adb forward 宿主侧端口(假阳性), 需等 /v1/state 200
            echo "== 3.5 等待 DebugServer 真实就绪 (HTTP 200, 最长 180s) =="
            TOKEN="droid-nightly-$GITHUB_RUN_ID"
            READY=0
            for i in $(seq 1 180); do
              python3 - "$TOKEN" <<'PYEOF' 2>/dev/null && { READY=1; echo "DebugServer 就绪 (${i}s)"; break; }
import sys, urllib.request
req = urllib.request.Request("http://127.0.0.1:8765/v1/state", headers={"X-Auth-Token": sys.argv[1]})
try:
    with urllib.request.urlopen(req, timeout=3) as r:
        sys.exit(0 if r.status == 200 else 1)
except Exception:
    sys.exit(1)
PYEOF
              sleep 1
            done
            if [ "$READY" != "1" ]; then echo "::error::DebugServer 180s 内未就绪"; adb logcat -d -s Nyral | tail -30; exit 1; fi
            echo "== 3.6 等待系统组件稳定 (软模拟易崩, 避免启动高峰撞测试) =="
            sleep 10

            echo "== 4. 靶场回归 T1-T6 (决策③) =="
            mkdir -p build
            python3 app/src/test/python/range_regression.py --emulator || { adb logcat -d -v time > build/range_logcat.txt 2>&1; tail -500 build/range_logcat.txt; exit 1; }

            echo "== 5. 性能采样 冷启动/内存/DebugServer延迟 (决策②) =="
            mkdir -p build
            python3 app/src/test/python/nightly_perf.py --emulator --json build/nightly-perf.json
            cat build/nightly-perf.json
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat build/nightly-perf.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload nightly results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-results
          path: |
            build/nightly-perf.json
            build/range_logcat.txt
            app/build/test-results/
          retention-days: 7
          if-no-files-found: warn

