name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  unit-tests:
    name: JVM Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # gradle wrapper 与依赖缓存（首次全量下载，之后增量）
      - name: Set up Gradle (cached)
        uses: gradle/actions/setup-gradle@v4

      - name: Run JVM unit tests
        run: ./gradlew :app:testDebugUnitTest --console=plain

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: |
            app/build/reports/tests/
            app/build/test-results/


  lint:
    name: Android Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Set up Gradle (cached)
        uses: gradle/actions/setup-gradle@v4

      # 静态检查门: 潜在 bug/可用性/性能问题云端提前暴露
      - name: Run lint
        run: ./gradlew :app:lintDebug --console=plain

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
  build-debug:
    name: Build Debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Set up Gradle (cached)
        uses: gradle/actions/setup-gradle@v4

      # 编译门：push/PR 必过，本地编译错误云端提前暴露
      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --console=plain

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk

  build-release:
    # N2(2026-10-03): 仅 push 触发签名 job, PR 不暴露签名 secrets
    if: github.event_name == 'push'
    name: Build Signed Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # gradle wrapper 与依赖缓存（首次全量下载，之后增量）
      - name: Set up Gradle (cached)
        uses: gradle/actions/setup-gradle@v4

      # 签名材料全部来自 GitHub Secrets，仓库不落任何口令/keystore
      - name: Restore keystore from secrets
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$HOME/nyral-release.keystore"
          ls -l "$HOME/nyral-release.keystore"

      - name: Generate keystore.properties (CI only, not committed)
        env:
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
        run: |
          cat > keystore.properties <<EOF
          storeFile=$HOME/nyral-release.keystore
          storePassword=$KS_PASS
          keyAlias=$KS_ALIAS
          keyPassword=$KS_PASS
          EOF
          echo "keystore.properties generated (credentials from secrets)"

      - name: Build signed release APK
        run: ./gradlew :app:assembleRelease --console=plain

      - name: Verify APK signature
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          echo "APK: ${APK}"
          keytool -printcert -jarfile "${APK}" 2>&1 | grep -E "Owner|SHA256:|Valid from" | head -5

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: signed-release-apk
          path: app/build/outputs/apk/release/*.apk

  license-check:
    name: Dependency License Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Set up Gradle (cached)
        uses: gradle/actions/setup-gradle@v4

      # 依赖坐标解析（无需编译；releaseRuntimeClasspath 即打包进 APK 的运行时依赖）
      # build/ 已在 .gitignore 中，deps.txt 不会入库
      - name: Resolve runtime dependencies
        run: ./gradlew :app:dependencies --configuration releaseRuntimeClasspath --console=plain > build/deps.txt 2>&1

      # 抓取 POM 核对许可证白名单；任何不在白名单或无法识别许可证的依赖都会让 CI 失败
      - name: Verify licenses against allowlist
        run: python3 .github/ci/license-check.py build/deps.txt

      # 保留依赖 dump 用于排查 license-check 失败（公开仓库可匿名下载）
      - name: Upload dependency dump
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deps-dump
          path: build/deps.txt
          retention-days: 3
